<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Radio — DX Shortwave</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Oswald:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="scanlines"></div>

    <div class="container-fluid">

        <!-- Header -->
        <header>
            <div class="header-brand">
                <div class="brand-deco">▐▌</div>
                <div class="brand-title">
                    <span class="brand-main">WORLD RADIO</span>
                    <span class="brand-sub">DX SHORTWAVE RECEIVER · EST. 1974</span>
                </div>
                <div class="brand-deco">▐▌</div>
            </div>
            <div class="header-controls">
                <div class="freq-display" id="header-freq">
                    <span class="freq-label">FREQ</span>
                    <span class="freq-value" id="header-freq-value">-- --- MHz</span>
                </div>
                <button id="show-all-btn" class="btn-retro">ALL BANDS</button>
                <div class="search-wrap">
                    <span class="search-icon">⌕</span>
                    <input type="text" id="search-input" placeholder="SEARCH STATIONS…" autocomplete="off">
                </div>
            </div>
        </header>

        <!-- Map -->
        <div class="map-frame">
            <div class="map-frame-label map-frame-tl">WORLD MAP — UTC</div>
            <div class="map-frame-label map-frame-tr" id="map-utc-time"></div>
            <div id="map"></div>
        </div>

        <!-- Station Grid -->
        <div class="band-header">
            <span class="band-line"></span>
            <span class="band-label" id="band-count">— STATIONS —</span>
            <span class="band-line"></span>
        </div>
        <main id="station-list" class="station-grid">
        </main>

        <footer>
            <span>WORLD RADIO DX</span>
            <span class="footer-dot">·</span>
            <span>SHORTWAVE RECEIVER</span>
            <span class="footer-dot">·</span>
            <span id="footer-year"></span>
        </footer>
    </div>

    <!-- Player Bar -->
    <div class="player-bar">
        <div class="player-info">
            <div class="player-logo-wrap">
                <img id="player-station-logo" src="" alt="" style="display:none"
                     onerror="this.onerror=null;this.style.display='none'">
                <div class="player-logo-placeholder" id="player-logo-placeholder">📻</div>
            </div>
            <div class="player-text">
                <div id="player-station-name" class="player-name">NO STATION SELECTED</div>
                <div id="player-station-country" class="player-country"></div>
                <div id="player-now-playing" class="player-now-playing"></div>
            </div>
        </div>
        <div class="player-center">
            <audio id="audio-player" controls></audio>
        </div>
        <div class="player-vol">
            <span class="vol-label">VOL</span>
            <input type="range" id="volume" min="0" max="1" step="0.01" value="0.5">
            <div class="signal-bars" id="signal-bars">
                <span></span><span></span><span></span><span></span><span></span>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNy7M08021qJv+p6d0fK/fC0LgYfN0L8a5+z1+9" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="script.js"></script>
</body>
</html>
